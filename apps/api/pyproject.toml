[project]
name = "olbostax-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "sqlalchemy>=2.0", "alembic>=1.14",
  "psycopg[binary]>=3.2", "pydantic-settings>=2.7", "email-validator>=2.2",
  "olbostax-schema", "olbostax-engine", "olbostax-security", "olbostax-efile",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
