[project]
name = "olbostax"
version = "0.1.0"
description = "OlbosTax - transparent flat-price tax preparation and filing"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services", "apps/api"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

# Put the repository root on sys.path so `from tests.fixtures... import ...`
# resolves. Without this, `python -m pytest` works (it prepends the working
# directory) while a bare `pytest` fails -- which is exactly how a suite passes
# on a developer's machine and fails in CI.
pythonpath = ["."]
markers = [
    "tax_engine: deterministic tax calculation tests",
    "regression: locked expected values that must not drift",
    "security: security control tests",
    "integration: requires a database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Test code asserts on invented credentials and long fixture literals.
"**/tests/**" = ["S", "E501"]
"tests/**" = ["S", "E501"]

# Alembic autogenerates these. Holding machine-written code to a hand-written
# line limit means either reformatting every generated migration by hand or
# ignoring the warning -- and a warning that is routinely ignored stops being
# read at all.
"apps/api/migrations/versions/*.py" = ["E501"]

# FastAPI's dependency injection is expressed as call-in-default-argument.
# B008 exists to catch mutable defaults evaluated once at import; here the
# call IS the declaration the framework reads, and rewriting it would mean
# abandoning dependency injection.
"apps/api/src/olbostax_api/routers/*.py" = ["B008"]
"apps/api/src/olbostax_api/dependencies.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
