[project]
name = "olbostax-security"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=44", "argon2-cffi>=23", "pyjwt>=2.10", "pyotp>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
